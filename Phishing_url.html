<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Inspector</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgb(15, 23, 42);
            color: rgb(226, 232, 240);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: rgb(30, 41, 59);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }
        h1 { margin-top: 0; color: rgb(56, 189, 248); text-align: center; }
        .subtitle { text-align: center; color: rgb(148, 163, 184); margin-bottom: 24px; }
        .scan-form { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgb(51, 65, 85);
            background: rgb(15, 23, 42);
            color: #fff;
            font-size: 16px;
        }
        input[type="text"]:focus { outline: none; border-color: rgb(56, 189, 248); }
        button {
            padding: 14px 24px;
            background: rgb(2, 132, 199);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: rgb(3, 105, 161); }
        .result-box {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border-radius: 8px;
            background: rgb(15, 23, 42);
            border-left: 6px solid rgb(56, 189, 248);
        }
        .result-box.safe   { display: block; border-left-color: rgb(34, 197, 94); }
        .result-box.danger { display: block; border-left-color: rgb(239, 68, 68); }
        .verdict { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .safe .verdict   { color: rgb(34, 197, 94); }
        .danger .verdict { color: rgb(239, 68, 68); }
        .meta { font-size: 14px; color: rgb(148, 163, 184); margin-bottom: 16px; word-break: break-word; }
        .findings { list-style: none; padding: 0; margin: 0; }
        .findings li {
            background: rgb(30, 41, 59);
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Phishing URL Inspector</h1>
        <p class="subtitle">Paste any link below to inspect it for phishing patterns and security risks.</p>

        <form class="scan-form" id="urlForm">
            <input type="text" id="urlInput" placeholder="Enter URL to inspect..." required>
            <button type="submit">Scan URL</button>
        </form>

        <div class="result-box" id="resultBox">
            <div class="verdict" id="verdictText"></div>
            <div class="meta" id="metaText"></div>
            <ul class="findings" id="findingsList"></ul>
        </div>
    </div>
        <script>
        var brands = ["paypal", "google", "amazon", "microsoft", "apple",
                      "netflix", "facebook", "bank", "sbi", "hdfc", "icici"];

        var suspiciousWords = ["login", "verify", "update", "secure",
                               "account", "banking", "password"];

        function getDomain(link) {
            if (!link.startsWith("http://") && !link.startsWith("https://")) {
                link = "http://" + link;
            }
            try {
                var u = new URL(link);
                return u.hostname.toLowerCase();
            } catch (e) {
                return ""; 
            }
        }

        function checkUrl(url) {
            var lower = url.toLowerCase();
            var domain = getDomain(url);
            var probs = [];

            if (!lower.startsWith("https://")) {
                probs.push("Missing HTTPS: Connection is not encrypted.");
            }

            var ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
            if (ipPattern.test(domain)) {
                probs.push("Raw IP Address: Uses an IP address instead of a proper domain name.");
            }

            var cleanDomain = domain;
            cleanDomain = cleanDomain.replace(/0/g, "o");
            cleanDomain = cleanDomain.replace(/1/g, "l");
            cleanDomain = cleanDomain.replace(/3/g, "e");
            cleanDomain = cleanDomain.replace(/5/g, "s");

            for (var i = 0; i < brands.length; i++) {
                var b = brands[i];
                if (cleanDomain.indexOf(b) !== -1) {
                    var isOfficial = false;
                    if (domain == b + ".com" || domain == b + ".in") {
                        isOfficial = true;
                    }
                    if (domain.endsWith("." + b + ".com") || domain.endsWith("." + b + ".in")) {
                        isOfficial = true;
                    }
                    if (isOfficial == false) {
                        probs.push("Fake Domain: Imitates '" + b + "' but is not the official website.");
                        break;
                    }
                }
            }

            var checkPart = lower;
            try {
                var parsed = new URL(lower.startsWith("http") ? lower : "http://" + lower);
                checkPart = parsed.hostname + parsed.pathname;
            } catch (e) {
                checkPart = lower;
            }

            var found_words = [];
            for (var j = 0; j < suspiciousWords.length; j++) {
                if (checkPart.indexOf(suspiciousWords[j]) != -1) {
                    found_words.push(suspiciousWords[j]);
                }
            }
            if (found_words.length > 0) {
                probs.push("Suspicious Words Found: " + found_words.join(", "));
            }

            return { domain: domain, problems: probs };
        }

        function showResult(domain, problems) {
            var box = document.getElementById("resultBox");
            var verdict = document.getElementById("verdictText");
            var meta = document.getElementById("metaText");
            var list = document.getElementById("findingsList");

            list.innerHTML = "";

            if (domain == "") {
                meta.textContent = "Domain: Invalid Domain";
            } else {
                meta.textContent = "Domain: " + domain;
            }

            var messages;

            if (problems.length == 0) {
                box.className = "result-box safe";
                verdict.textContent = "SAFE (No Threats Detected)";
                messages = ["HTTPS Enabled: Connection uses standard encryption."];
            } else {
                box.className = "result-box danger";
                verdict.textContent = "DANGEROUS (Likely Phishing)";
                messages = problems;
            }

            for (var i = 0; i < messages.length; i++) {
                var li = document.createElement("li");
                li.textContent = messages[i];
                list.appendChild(li);
            }
        }

        var form = document.getElementById("urlForm");
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            var input = document.getElementById("urlInput");
            var value = input.value.trim();

            if (value == "") {
                return;
            }

            var result = checkUrl(value);
            showResult(result.domain, result.problems);
        });
    </script>
</body>
</html>
